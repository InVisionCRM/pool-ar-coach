<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Trick Shots &amp; Cue Lab · Pool AR Coach</title>
<style>
:root{color-scheme:dark;--bg:#0d1210;--panel:rgba(22,30,26,.94);--line:#2c3932;--green:#83f28f;--muted:#a9b8ae;--orange:#ffbd69;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#f2f6f3;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
#top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:calc(4px + var(--sat)) calc(8px + var(--sar)) 4px calc(8px + var(--sal));background:#111815;border-bottom:1px solid var(--line);min-height:52px}
.brand{display:flex;align-items:center;gap:6px;color:#f2f6f3;text-decoration:none;font-weight:700;min-height:44px;padding:0 8px;border-radius:12px;border:1px solid #33433a;background:#18221d;white-space:nowrap}
.brand span{font-size:13px}
select,button{font:inherit;color:#f2f6f3;background:#1f2b25;border:1px solid #3c4d43;border-radius:12px;min-height:44px;touch-action:manipulation}
select{padding:0 8px;min-width:0}button{padding:0 12px;cursor:pointer}
button.on{background:#2c4a35;border-color:var(--green)}
#modeSel{font-weight:700;max-width:140px}
.pick{display:flex;flex:1;min-width:0;gap:4px}.pick select{flex:1;width:100%}
.pick button{width:44px;padding:0;flex:none}
#menuBtn{width:48px;padding:0;font-size:20px;flex:none}
#menu{position:fixed;z-index:50;right:calc(8px + var(--sar));top:calc(56px + var(--sat));width:270px;max-height:calc(100% - 70px);overflow:auto;background:#141c18;border:1px solid #3c4d43;border-radius:16px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.55)}
#menu[hidden]{display:none}
#menu .mi{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;padding:2px 8px;border-radius:10px}
#menu .mi label{flex:1}#menu .mi select{min-height:38px}
#menu button.wide{width:100%;margin:4px 0;text-align:left}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#menu a{color:var(--green)}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:#33413a;position:relative;flex:none;margin:0;cursor:pointer}
.sw:checked{background:var(--green)}.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}.sw:checked::after{left:21px}
#stage{position:relative;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 40%,#16201b,#0a0e0c)}
#table{position:absolute;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
#strip{display:flex;justify-content:center;align-items:center;gap:8px;padding:6px calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));background:#111815;border-top:1px solid var(--line)}
#strip button{min-width:56px;height:48px;font-size:18px;font-weight:700}
#playBtn{background:var(--green);color:#0f2014;border-color:var(--green);min-width:84px!important}
#playBtn.pause{background:#ffd27d;border-color:#ffd27d}
#slowBtn{font-size:15px!important}
#toast{position:absolute;left:27%;top:3px;transform:translateX(-50%);max-width:46%;background:rgba(10,14,12,.86);border:1px solid #3c4d43;border-radius:999px;padding:4px 12px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:5}
#toast.show{opacity:1}#toast.ok{border-color:var(--green);color:var(--green)}#toast.bad{border-color:#ff9c8a;color:#ffc1b5}
#rotateHint{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(17,24,21,.92);border:1px solid #3c4d43;border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:13px;z-index:6}
#rotateHint[hidden]{display:none}#rotateHint button{min-height:36px;margin-left:auto}
.card{position:fixed;z-index:20;width:300px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid #3c4d43;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card-h{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 4px 0 10px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.card-h .grip{color:#7d8f84;font-size:16px;letter-spacing:-2px}
.card-h b{font-size:14px;white-space:nowrap}
.card-h .sum{color:var(--muted);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-h .fold{width:44px;min-height:40px;padding:0;border:0;background:transparent;font-size:18px;color:var(--muted)}
.card-b{padding:0 10px 10px;overflow:auto;max-height:calc(100vh - 120px);-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card.folded{width:auto;max-width:240px;border-radius:999px}.card.folded .card-b{display:none}.card.folded .card-h{padding-right:10px}.card.folded .fold{display:none}
.card.dragging{opacity:.85;cursor:grabbing}
.pads{display:flex;gap:8px;justify-content:space-between}
.pad{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.pad canvas{width:100%;max-width:136px;height:auto;aspect-ratio:1/1;display:block;margin:0 auto 2px;background:#0f1612;border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:crosshair}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}.row label{font-size:12px;color:var(--muted);width:70px;flex:none}
input[type=range]{flex:1;accent-color:var(--green);height:36px;margin:0}
.nudge{display:flex;gap:4px;flex:1}.nudge button{flex:1;min-height:40px;padding:0;font-size:13px}
.effects{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.fx{background:#18231d;border:1px solid #2f4036;border-radius:10px;padding:5px 8px;font-size:12px}.fx b{color:var(--orange)}
.stars{color:var(--orange);letter-spacing:1px}
.muted{color:var(--muted);font-size:12px}
h2{font-size:15px;margin:4px 0}
ol{margin:6px 0 0;padding-left:20px}ol li{margin:2px 0}
.goal{margin-top:8px;padding:8px;border-radius:10px;background:#16241b;border:1px dashed #4f8a5a;font-size:13px}
.goal.done{border-style:solid;border-color:var(--green);color:var(--green)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;margin-top:6px}.facts b{color:var(--muted);font-weight:600}
.spinrow{display:flex;gap:8px;align-items:center;margin-top:8px}.spinrow canvas{width:84px;height:84px;flex:none;background:#0f1612;border-radius:12px;border:1px solid var(--line)}
.smallbtn{min-height:40px;margin-top:8px}
@media (orientation:landscape) and (max-height:560px){
 #app{grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) auto}
 #top{min-height:48px;padding-top:calc(2px + var(--sat));padding-bottom:2px}
 #strip{grid-row:2;grid-column:2;flex-direction:column;justify-content:center;border-top:0;border-left:1px solid var(--line);padding:6px calc(6px + var(--sar)) calc(6px + var(--sab)) 6px}
 #strip button{min-width:60px!important;width:64px}
 #menu{top:calc(52px + var(--sat))}
 .card{width:272px}.pad canvas{max-width:104px}.effects{margin-top:6px}.fx{padding:3px 7px}
}
@media (max-width:480px){.brand span{display:none}.pick button{display:none}#modeSel{max-width:118px}}
</style>
</head>
<body>
<div id="app">
 <header id="top">
  <a class="brand" href="./" title="Pool AR Coach (camera)">🎱<span>Coach</span></a>
  <select id="modeSel" aria-label="Mode"><option value="trick">Trick shots</option><option value="lab">Cue Lab</option><option value="free">Free play</option></select>
  <div class="pick"><button id="prevBtn" aria-label="Previous">‹</button><select id="itemSel" aria-label="Shot or lesson"></select><button id="nextBtn" aria-label="Next">›</button></div>
  <button id="menuBtn" aria-label="Settings" aria-expanded="false">☰</button>
 </header>
 <main id="stage"><canvas id="table" aria-label="Pool table"></canvas><div id="toast"></div>
  <div id="rotateHint" hidden><span style="font-size:20px">📱↻</span><span>Turn your phone sideways to see the full table.</span><button id="rotateClose" aria-label="Dismiss">✕</button></div></main>
 <nav id="strip"><button id="playBtn" aria-label="Play">▶</button><button id="resetBtn" aria-label="Reset">⟲</button><button id="slowBtn" aria-label="Slow motion">1×</button></nav>
</div>
<div id="menu" hidden>
 <div class="mi"><label for="optTrails">Trails</label><input type="checkbox" class="sw" id="optTrails" checked></div>
 <div class="mi"><label for="optPath">Expected path</label><input type="checkbox" class="sw" id="optPath" checked></div>
 <div class="mi"><label for="optSound">Sound</label><input type="checkbox" class="sw" id="optSound"></div>
 <div class="mi"><label for="optSlow">Slow-mo speed</label><select id="optSlow"><option value="0.5">0.5×</option><option value="0.25" selected>0.25×</option><option value="0.1">0.1×</option></select></div>
 <div class="mi"><label for="optSize">Table size<br><span class="muted">Free play</span></label><select id="optSize"><option value="7">7 ft</option><option value="8">8 ft</option><option value="9" selected>9 ft</option></select></div>
 <hr>
 <button class="wide" id="origBtn">↺ Restore original setup</button>
 <button class="wide" id="layoutBtn">⤧ Reset card layout</button>
 <hr>
 <div class="muted" style="padding:4px 8px">Drag balls to move them. Drag on the cloth to aim. Drag a card by its title bar; tap – to shrink it to a pill. <a href="./">Back to the camera Coach</a>.</div>
</div>
<section class="card" id="cueCard" data-card="cue">
 <div class="card-h"><span class="grip">⠿</span><b>Cue</b><span class="sum" id="cueSum"></span><button class="fold" aria-label="Collapse">–</button></div>
 <div class="card-b">
  <div class="pads">
   <div class="pad"><canvas id="tipPad" width="272" height="272"></canvas>Tip contact (drag)</div>
   <div class="pad"><canvas id="elevPad" width="272" height="272"></canvas>Stick angle (drag)</div>
  </div>
  <div class="row"><label for="power">Power <b id="powerVal"></b></label><input type="range" id="power" min="1" max="100" step="1"></div>
  <div class="row"><label>Aim <b id="aimVal"></b></label><div class="nudge"><button data-nudge="-1">−1°</button><button data-nudge="-0.1">−.1</button><button data-nudge="0.1">+.1</button><button data-nudge="1">+1°</button></div></div>
  <div class="effects" id="effects"></div>
 </div>
</section>
<section class="card" id="infoCard" data-card="info">
 <div class="card-h"><span class="grip">⠿</span><b id="infoTitle">Shot</b><span class="sum" id="infoSum"></span><button class="fold" aria-label="Collapse">–</button></div>
 <div class="card-b" id="infoBody"></div>
</section>
<script src="physics.js"></script>
<script src="shots.js"></script>
<script src="trick.js"></script>
</body>
</html>
